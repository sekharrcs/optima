name: Foundation plan and apply
run-name: Foundation ${{ inputs.operation }} · ${{ github.sha }}

# Safely separated foundation planning and application for the approved profile
# location=eastus2, deployContainerApps=false, exposePublicUi=false,
# deployRuntimeAccess=false, semanticCacheEnabled=false. This workflow never
# builds or publishes an image, never deploys a Container App, never creates a
# runtime role assignment, and never configures Entra, Redis, embeddings, or
# inference canaries. Full application rollout stays in deploy-production.yml.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Foundation operation to run
        required: true
        type: choice
        default: foundation-plan
        options:
          - foundation-plan
          - foundation-apply
      confirm_commit_sha:
        description: Full commit SHA promoted (foundation-apply only)
        required: false
        type: string
      confirm_foundation:
        description: Type APPLY-FOUNDATION to authorize foundation mutation
        required: false
        type: string
      plan_run_id:
        description: foundation-plan run ID whose evidence authorizes this apply
        required: false
        type: string
      confirm_plan_actor:
        description: Actor who dispatched the approved foundation-plan
        required: false
        type: string
      confirm_plan_artifact_digest:
        description: Reviewed sha256 digest of the approved plan artifact
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: optima-hackathon-azure-mutation
  cancel-in-progress: false

env:
  UV_NO_CACHE: "1"
  BICEP_VERSION: "0.46.1"

jobs:
  validate:
    name: Validate exact foundation source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1, resolved from the upstream tag with git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false

      - name: Verify main head and operation-specific authorization
        shell: bash
        env:
          CONFIRMED_SHA: "${{ inputs.confirm_commit_sha }}"
          CONFIRM_FOUNDATION: "${{ inputs.confirm_foundation }}"
          PLAN_ACTOR: "${{ inputs.confirm_plan_actor }}"
          PLAN_ARTIFACT_DIGEST: "${{ inputs.confirm_plan_artifact_digest }}"
          PLAN_RUN_ID: "${{ inputs.plan_run_id }}"
          REQUESTED_OPERATION: "${{ inputs.operation }}"
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git fetch --no-tags --prune --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo "Checkout credentials remain configured" >&2
            exit 1
          fi
          case "$REQUESTED_OPERATION" in
            foundation-plan)
              test -z "$CONFIRMED_SHA"
              test -z "$CONFIRM_FOUNDATION"
              test -z "$PLAN_RUN_ID"
              test -z "$PLAN_ACTOR"
              test -z "$PLAN_ARTIFACT_DIGEST"
              ;;
            foundation-apply)
              test "$CONFIRM_FOUNDATION" = "APPLY-FOUNDATION"
              test "$CONFIRMED_SHA" = "$GITHUB_SHA"
              [[ "$CONFIRMED_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$PLAN_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$PLAN_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
              [[ "$PLAN_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
              ;;
            *)
              echo "Unsupported foundation operation" >&2
              exit 1
              ;;
          esac

      # astral-sh/setup-uv v10.0.1, resolved from the upstream tag with git ls-remote.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          enable-cache: false
          python-version: "3.12"

      - name: Run application quality gates
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --all-groups
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src tests
          uv run --no-sync python -m pytest

      - name: Validate all Bicep entry points
        shell: bash
        run: |
          set -euo pipefail
          az bicep install --version "v$BICEP_VERSION"
          test "$(az bicep version | sed -n 's/.*Bicep CLI version \([^ ]*\).*/\1/p')" = "$BICEP_VERSION"
          test -f infra/environments/hackathon.foundation.bicepparam
          formatted_dir="$(mktemp -d)"
          trap 'rm -rf "$formatted_dir"' EXIT
          for file in infra/main.bicep infra/resource-group.bicep infra/modules/*.bicep; do
            az bicep build --file "$file" --stdout >/dev/null
            az bicep format --file "$file" --outfile "$formatted_dir/$(basename "$file")"
            diff --unified "$file" "$formatted_dir/$(basename "$file")"
          done
          for file in infra/environments/*.bicepparam; do
            az bicep build-params --file "$file" --stdout >/dev/null
            az bicep format --file "$file" --outfile "$formatted_dir/$(basename "$file")"
            diff --unified "$file" "$formatted_dir/$(basename "$file")"
          done

  foundation-plan:
    name: Read-only foundation plan
    if: ${{ inputs.operation == 'foundation-plan' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: hackathon
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: "${{ vars.AZURE_CLIENT_ID }}"
      AZURE_DEPLOYMENT_IDENTITY_RESOURCE_ID: "${{ vars.AZURE_DEPLOYMENT_IDENTITY_RESOURCE_ID }}"
      AZURE_FOUNDATION_PLAN_CLIENT_ID: "${{ vars.AZURE_FOUNDATION_PLAN_CLIENT_ID }}"
      AZURE_FOUNDATION_PLAN_IDENTITY_RESOURCE_ID: "${{ vars.AZURE_FOUNDATION_PLAN_IDENTITY_RESOURCE_ID }}"
      AZURE_FOUNDATION_PLAN_ROLE_DEFINITION_ID: "${{ vars.AZURE_FOUNDATION_PLAN_ROLE_DEFINITION_ID }}"
      AZURE_LOCATION: "${{ vars.AZURE_LOCATION }}"
      AZURE_RESOURCE_GROUP: "${{ vars.AZURE_RESOURCE_GROUP }}"
      AZURE_SUBSCRIPTION_ID: "${{ vars.AZURE_SUBSCRIPTION_ID }}"
      AZURE_TENANT_ID: "${{ vars.AZURE_TENANT_ID }}"
      OPTIMA_COST_REVIEWED_ON: "${{ vars.OPTIMA_COST_REVIEWED_ON }}"
      OPTIMA_EXPECTED_FIXED_MONTHLY_COST_INR: "${{ vars.OPTIMA_EXPECTED_FIXED_MONTHLY_COST_INR }}"
      OPTIMA_GITHUB_ENVIRONMENT: hackathon
      OPTIMA_SEMANTIC_CACHE_ENABLED: "false"
    steps:
      # actions/checkout v7.0.1, resolved from the upstream tag with git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify the current protected main head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git fetch --no-tags --prune --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo "Checkout credentials remain configured" >&2
            exit 1
          fi

      # Azure/login v2.3.0 peeled commit; the annotated tag object is not a commit.
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: "${{ vars.AZURE_FOUNDATION_PLAN_CLIENT_ID }}"
          tenant-id: "${{ vars.AZURE_TENANT_ID }}"
          subscription-id: "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Verify identity, permitted scopes, and foundation readiness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/azure_preflight.py --phase foundation-plan \
            --output "$RUNNER_TEMP/foundation-preflight.json"

      - name: Write the effective foundation parameter set
        shell: bash
        run: |
          set -euo pipefail
          test "$AZURE_LOCATION" = "eastus2"
          test "$AZURE_RESOURCE_GROUP" = "rg-optima-hackathon"
          {
            printf 'location=%s\n' "$AZURE_LOCATION"
            printf 'environmentName=%s\n' "hackathon"
            printf 'resourceGroup=%s\n' "$AZURE_RESOURCE_GROUP"
            printf 'templateFile=%s\n' "infra/resource-group.bicep"
            printf 'parameterFile=%s\n' "infra/environments/hackathon.foundation.bicepparam"
            printf 'deployContainerApps=%s\n' "false"
            printf 'exposePublicUi=%s\n' "false"
            printf 'deployRuntimeAccess=%s\n' "false"
            printf 'semanticCacheEnabled=%s\n' "false"
          } > "$RUNNER_TEMP/foundation-parameters.txt"

      - name: Run exactly one authoritative foundation what-if
        shell: bash
        run: |
          set -euo pipefail
          if ! az group show --name "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Approved resource group is absent; foundation plan requires it" >&2
            exit 1
          fi
          running="$(az deployment group list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?starts_with(name, 'optima-foundation-') && properties.provisioningState!='Succeeded' && properties.provisioningState!='Failed' && properties.provisioningState!='Canceled' && properties.provisioningState!='Deleted'].name" \
            --output tsv)"
          if test -n "$running"; then
            echo "A foundation deployment is already running" >&2
            exit 1
          fi
          az deployment group what-if --name optima-foundation-promotion-whatif \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/resource-group.bicep \
            --parameters infra/environments/hackathon.foundation.bicepparam \
            --parameters \
              "deploymentCommitSha=$GITHUB_SHA" \
              "deploymentWorkflowRunId=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --validation-level ProviderNoRbac \
            --result-format FullResourcePayloads \
            --no-pretty-print --only-show-errors \
            > "$RUNNER_TEMP/foundation-whatif.json"

      - name: Classify the foundation what-if and emit sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/whatif_classification.py classify \
            --whatif "$RUNNER_TEMP/foundation-whatif.json" \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --commit-sha "$GITHUB_SHA" \
            --parameters-file "$RUNNER_TEMP/foundation-parameters.txt" \
            --output "$RUNNER_TEMP/foundation-plan-evidence.json"
          rm -f "$RUNNER_TEMP/foundation-whatif.json"
          {
            printf '## OPTIMA foundation plan\n\n'
            printf -- '- Operation: `foundation-plan` (read-only, no Azure mutation)\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Classification: `APPROVED`\n'
            printf -- '- Review the sanitized plan evidence artifact before apply.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # actions/upload-artifact v7.0.1, resolved from the upstream tag with git ls-remote.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foundation-plan-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/foundation-plan-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  foundation-apply:
    name: Promoted foundation apply
    if: ${{ inputs.operation == 'foundation-apply' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: hackathon
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: "${{ vars.AZURE_CLIENT_ID }}"
      AZURE_DEPLOYMENT_IDENTITY_RESOURCE_ID: "${{ vars.AZURE_DEPLOYMENT_IDENTITY_RESOURCE_ID }}"
      AZURE_FOUNDATION_PLAN_CLIENT_ID: "${{ vars.AZURE_FOUNDATION_PLAN_CLIENT_ID }}"
      AZURE_FOUNDATION_PLAN_IDENTITY_RESOURCE_ID: "${{ vars.AZURE_FOUNDATION_PLAN_IDENTITY_RESOURCE_ID }}"
      AZURE_LOCATION: "${{ vars.AZURE_LOCATION }}"
      AZURE_RESOURCE_GROUP: "${{ vars.AZURE_RESOURCE_GROUP }}"
      AZURE_SUBSCRIPTION_ID: "${{ vars.AZURE_SUBSCRIPTION_ID }}"
      AZURE_TENANT_ID: "${{ vars.AZURE_TENANT_ID }}"
      OPTIMA_COST_REVIEWED_ON: "${{ vars.OPTIMA_COST_REVIEWED_ON }}"
      OPTIMA_EXPECTED_FIXED_MONTHLY_COST_INR: "${{ vars.OPTIMA_EXPECTED_FIXED_MONTHLY_COST_INR }}"
      OPTIMA_GITHUB_ENVIRONMENT: hackathon
      OPTIMA_SEMANTIC_CACHE_ENABLED: "false"
    steps:
      # actions/checkout v7.0.1, resolved from the upstream tag with git ls-remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify the current protected main head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git fetch --no-tags --prune --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo "Checkout credentials remain configured" >&2
            exit 1
          fi

      - name: Authenticate the approved plan run and artifact
        id: provenance
        shell: bash
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          PLAN_ACTOR: "${{ inputs.confirm_plan_actor }}"
          PLAN_ARTIFACT_DIGEST: "${{ inputs.confirm_plan_artifact_digest }}"
          PLAN_RUN_ID: "${{ inputs.plan_run_id }}"
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          curl_arguments=(
            --fail
            --silent
            --show-error
            --proto '=https'
            --tlsv1.2
            --retry 3
            --retry-all-errors
            --connect-timeout 10
            --max-time 60
            --header "Accept: application/vnd.github+json"
            --header "Authorization: Bearer $GITHUB_TOKEN"
            --header "X-GitHub-Api-Version: 2022-11-28"
            --header "User-Agent: optima-foundation-promotion"
          )
          curl "${curl_arguments[@]}" --output "$RUNNER_TEMP/source-run.json" \
            "$api/actions/runs/$PLAN_RUN_ID"
          curl "${curl_arguments[@]}" --output "$RUNNER_TEMP/source-jobs.json" \
            "$api/actions/runs/$PLAN_RUN_ID/jobs?filter=all&per_page=100"
          curl "${curl_arguments[@]}" --output "$RUNNER_TEMP/source-artifacts.json" \
            "$api/actions/runs/$PLAN_RUN_ID/artifacts?per_page=100"
          curl "${curl_arguments[@]}" --output "$RUNNER_TEMP/recent-runs.json" \
            "$api/actions/workflows/foundation.yml/runs?per_page=100"
          python scripts/foundation_promotion.py \
            --source-run-json "$RUNNER_TEMP/source-run.json" \
            --source-jobs-json "$RUNNER_TEMP/source-jobs.json" \
            --source-artifacts-json "$RUNNER_TEMP/source-artifacts.json" \
            --recent-runs-json "$RUNNER_TEMP/recent-runs.json" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-workflow-path ".github/workflows/foundation.yml" \
            --expected-branch "main" \
            --expected-head-sha "$GITHUB_SHA" \
            --expected-plan-run-id "$PLAN_RUN_ID" \
            --current-apply-run-id "$GITHUB_RUN_ID" \
            --expected-plan-actor "$PLAN_ACTOR" \
            --confirmed-artifact-digest "$PLAN_ARTIFACT_DIGEST" \
            --current-time "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --maximum-age-seconds 86400 \
            --github-output "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/source-run.json" "$RUNNER_TEMP/source-jobs.json" \
            "$RUNNER_TEMP/source-artifacts.json" "$RUNNER_TEMP/recent-runs.json"

      # actions/download-artifact v8.0.1, resolved from the upstream tag with git ls-remote.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: "${{ steps.provenance.outputs.artifact_id }}"
          run-id: "${{ inputs.plan_run_id }}"
          github-token: "${{ github.token }}"
          repository: "${{ github.repository }}"
          path: ${{ runner.temp }}/plan-evidence

      - name: Require exactly one canonical regular evidence file
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/plan-evidence"
          expected="$(realpath -m "$root/foundation-plan-evidence.json")"
          mapfile -d '' entries < <(find "$root" -mindepth 1 -print0)
          test "${#entries[@]}" -eq 1
          test "${entries[0]}" = "$root/foundation-plan-evidence.json"
          test -f "${entries[0]}"
          test ! -L "${entries[0]}"
          test "$(realpath "${entries[0]}")" = "$expected"

      # Azure/login v2.3.0 peeled commit; the annotated tag object is not a commit.
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: "${{ vars.AZURE_CLIENT_ID }}"
          tenant-id: "${{ vars.AZURE_TENANT_ID }}"
          subscription-id: "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Verify identity, permitted scopes, and foundation readiness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/azure_preflight.py --phase foundation-apply \
            --output "$RUNNER_TEMP/foundation-preflight.json"

      - name: Write the effective foundation parameter set
        shell: bash
        run: |
          set -euo pipefail
          test "$AZURE_LOCATION" = "eastus2"
          test "$AZURE_RESOURCE_GROUP" = "rg-optima-hackathon"
          {
            printf 'location=%s\n' "$AZURE_LOCATION"
            printf 'environmentName=%s\n' "hackathon"
            printf 'resourceGroup=%s\n' "$AZURE_RESOURCE_GROUP"
            printf 'templateFile=%s\n' "infra/resource-group.bicep"
            printf 'parameterFile=%s\n' "infra/environments/hackathon.foundation.bicepparam"
            printf 'deployContainerApps=%s\n' "false"
            printf 'exposePublicUi=%s\n' "false"
            printf 'deployRuntimeAccess=%s\n' "false"
            printf 'semanticCacheEnabled=%s\n' "false"
          } > "$RUNNER_TEMP/foundation-parameters.txt"

      - name: Run a fresh authoritative foundation what-if and reclassify
        shell: bash
        env:
          PLAN_RUN_ID: "${{ inputs.plan_run_id }}"
          SOURCE_RUN_ATTEMPT: "${{ steps.provenance.outputs.source_run_attempt }}"
        run: |
          set -euo pipefail
          if ! az group show --name "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Approved resource group is absent; foundation apply requires it" >&2
            exit 1
          fi
          running="$(az deployment group list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?starts_with(name, 'optima-foundation-') && properties.provisioningState!='Succeeded' && properties.provisioningState!='Failed' && properties.provisioningState!='Canceled' && properties.provisioningState!='Deleted'].name" \
            --output tsv)"
          if test -n "$running"; then
            echo "A foundation deployment is already running" >&2
            exit 1
          fi
          az deployment group what-if --name optima-foundation-promotion-whatif \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/resource-group.bicep \
            --parameters infra/environments/hackathon.foundation.bicepparam \
            --parameters \
              "deploymentCommitSha=$GITHUB_SHA" \
              "deploymentWorkflowRunId=$PLAN_RUN_ID-$SOURCE_RUN_ATTEMPT" \
            --validation-level ProviderNoRbac \
            --result-format FullResourcePayloads \
            --no-pretty-print --only-show-errors \
            > "$RUNNER_TEMP/foundation-whatif.json"
          python scripts/whatif_classification.py classify \
            --whatif "$RUNNER_TEMP/foundation-whatif.json" \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --commit-sha "$GITHUB_SHA" \
            --parameters-file "$RUNNER_TEMP/foundation-parameters.txt" \
            --output "$RUNNER_TEMP/foundation-apply-evidence.json"
          rm -f "$RUNNER_TEMP/foundation-whatif.json"

      - name: Refuse promotion unless the fresh plan matches the approved plan
        shell: bash
        run: |
          set -euo pipefail
          python scripts/whatif_classification.py promote-check \
            --plan "$RUNNER_TEMP/plan-evidence/foundation-plan-evidence.json" \
            --apply "$RUNNER_TEMP/foundation-apply-evidence.json"

      - name: Deploy only the Azure foundation
        id: deploy
        shell: bash
        env:
          PLAN_RUN_ID: "${{ inputs.plan_run_id }}"
          SOURCE_RUN_ATTEMPT: "${{ steps.provenance.outputs.source_run_attempt }}"
        run: |
          set -euo pipefail
          deployment_name="optima-foundation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$deployment_name" =~ ^optima-foundation-[1-9][0-9]*-[1-9][0-9]*$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git fetch --no-tags --prune --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          az deployment group create \
            --name "$deployment_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/resource-group.bicep \
            --parameters infra/environments/hackathon.foundation.bicepparam \
            --parameters \
              "deploymentCommitSha=$GITHUB_SHA" \
              "deploymentWorkflowRunId=$PLAN_RUN_ID-$SOURCE_RUN_ATTEMPT" \
            --only-show-errors >/dev/null

      - name: Reconcile the exact foundation deployment
        if: ${{ always() && steps.deploy.outcome != 'skipped' }}
        shell: bash
        env:
          DEPLOYMENT_NAME: "optima-foundation-${{ github.run_id }}-${{ github.run_attempt }}"
          DEPLOY_OUTCOME: "${{ steps.deploy.outcome }}"
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_NAME" =~ ^optima-foundation-[1-9][0-9]*-[1-9][0-9]*$ ]]
          state=UNAVAILABLE
          cancel_attempted=false
          cancel_result=not-needed
          if observed="$(az deployment group show \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.provisioningState --output tsv 2>/dev/null)"; then
            case "$observed" in
              Accepted | Canceled | Created | Creating | Deleted | Deleting | Failed | Ready | Running | Succeeded)
                state="$observed"
                ;;
              *) state=INVALID ;;
            esac
          fi
          case "$state" in
            Accepted | Running)
              cancel_attempted=true
              if az deployment group cancel \
                --name "$DEPLOYMENT_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
                cancel_result=requested
              else
                cancel_result=failed
              fi
              state=UNAVAILABLE
              if observed="$(az deployment group show \
                --name "$DEPLOYMENT_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --query properties.provisioningState --output tsv 2>/dev/null)"; then
                case "$observed" in
                  Accepted | Canceled | Created | Creating | Deleted | Deleting | Failed | Ready | Running | Succeeded)
                    state="$observed"
                    ;;
                  *) state=INVALID ;;
                esac
              fi
              ;;
          esac
          printf '{"schema_version":"optima-foundation-reconciliation-v1","deployment_name":"%s","deploy_step_outcome":"%s","observed_state":"%s","cancel_attempted":%s,"cancel_result":"%s"}\n' \
            "$DEPLOYMENT_NAME" "$DEPLOY_OUTCOME" "$state" \
            "$cancel_attempted" "$cancel_result" \
            > "$RUNNER_TEMP/foundation-reconciliation.json"
          test "$DEPLOY_OUTCOME" = "success"
          test "$state" = "Succeeded"

      - name: Verify foundation convergence and stop
        shell: bash
        env:
          PLAN_RUN_ID: "${{ inputs.plan_run_id }}"
          SOURCE_RUN_ATTEMPT: "${{ steps.provenance.outputs.source_run_attempt }}"
        run: |
          set -euo pipefail
          az deployment group what-if --name optima-foundation-converged-whatif \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/resource-group.bicep \
            --parameters infra/environments/hackathon.foundation.bicepparam \
            --parameters \
              "deploymentCommitSha=$GITHUB_SHA" \
              "deploymentWorkflowRunId=$PLAN_RUN_ID-$SOURCE_RUN_ATTEMPT" \
            --validation-level ProviderNoRbac \
            --result-format FullResourcePayloads \
            --no-pretty-print --only-show-errors \
            > "$RUNNER_TEMP/foundation-converged-whatif.json"
          python scripts/whatif_classification.py classify \
            --whatif "$RUNNER_TEMP/foundation-converged-whatif.json" \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --commit-sha "$GITHUB_SHA" \
            --parameters-file "$RUNNER_TEMP/foundation-parameters.txt" \
            --output "$RUNNER_TEMP/foundation-converged-evidence.json"
          rm -f "$RUNNER_TEMP/foundation-converged-whatif.json"
          {
            printf '## OPTIMA foundation apply\n\n'
            printf -- '- Operation: `foundation-apply` (foundation resources only)\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Provisioning state: `Succeeded`\n'
            printf -- '- No image build, ACR publication, Container App, runtime access,\n'
            printf -- '  Entra configuration, Redis, embedding, or inference occurred.\n'
            printf -- '- Next stage: the application rollout in deploy-production.yml.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # actions/upload-artifact v7.0.1, resolved from the upstream tag with git ls-remote.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: foundation-apply-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/foundation-apply-evidence.json
            ${{ runner.temp }}/foundation-converged-evidence.json
            ${{ runner.temp }}/foundation-preflight.json
            ${{ runner.temp }}/foundation-reconciliation.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
